[package]
name = "gg-rewards"
description = "GPU Goblin reward distribution contract (CosmWasm): committed batches, Merkle claims, no real funds"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gg-merkle = { path = "../../crates/gg-merkle" }
cosmwasm-std = "3.0.9"
cosmwasm-schema = "3.0.9"
cw-storage-plus = "3.0.1"
cw2 = "3.0.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
hex = "0.4.3"

[dev-dependencies]
cw-multi-test = "3.0.1"
anyhow = "1.0.104"
serde_json = "1.0.151"
hex = "0.4.3"

# Own workspace: a CosmWasm contract needs `panic = "abort"` for wasm32, and that cannot be set per
# package inside the main workspace. `cargo xtask check` builds and tests it explicitly.
[workspace]

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = "abort"
incremental = false
overflow-checks = true
