[workspace]
resolver = "3"
# The reward contract is a separate workspace: CosmWasm requires panic = "abort" for wasm32, which
# cannot be set per package. `cargo xtask check` builds and tests it.
exclude = ["contracts/gg-rewards"]
members = [
    "crates/gg-storage",
    "crates/gg-ledger",
    "crates/gg-merkle",
    "crates/gg-control",
    "crates/gg-verifier",
    "crates/gg-node",
    "crates/gg-cli",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
# Free for research and any noncommercial use; source-available, not open source.
# LICENSE holds the authoritative text; LICENSING.md explains it.
license = "PolyForm-Noncommercial-1.0.0"
license-file = "LICENSE"
repository = "https://github.com/GPU-Goblin/gg-server"
publish = false

[workspace.dependencies]
# --- GPU Goblin shared crates (repository gg-core, pinned by tag) ---
gg-core = { git = "https://github.com/GPU-Goblin/gg-core", tag = "v0.1.0" }
gg-protocol = { git = "https://github.com/GPU-Goblin/gg-core", tag = "v0.1.0" }
gg-compute = { git = "https://github.com/GPU-Goblin/gg-core", tag = "v0.1.0", default-features = false }
gg-client = { git = "https://github.com/GPU-Goblin/gg-core", tag = "v0.1.0" }

# --- domain / protocol ---
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = "0.11.0"
getrandom = "0.4.3"
hex = "0.4.3"
base64 = "0.23.1"
uuid = { version = "1.26.1", features = ["v7", "serde"] }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
thiserror = "2.0.20"
anyhow = "1.0.104"
zeroize = "1.9.0"

# --- async / web ---
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "fs", "io-util", "time", "sync", "process", "net"] }
tokio-util = { version = "0.7.19", features = ["io"] }
futures-util = "0.3.34"
axum = { version = "0.8.9", features = ["json", "tokio", "http1", "macros"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "limit", "timeout", "request-id", "set-header"] }
http = "1.5.0"
rustls = { version = "0.23.45", default-features = false, features = ["std", "aws_lc_rs", "logging"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "http2", "charset", "form"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "aws-lc-rs", "rustls-native-certs"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid", "time"] }
utoipa-axum = "0.2.0"

# --- persistence ---
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "uuid", "time", "json", "migrate", "macros"] }
tempfile = "3.27.0"

# --- config / cli / observability ---
clap = { version = "4.6.7", features = ["derive", "env"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 1

# The native CUDA engine needs burn-tch not to write in place into tensors PyTorch's autograd
# tracks (vendor/burn-tch/GPU-GOBLIN.md in gg-core).
[patch.crates-io]
burn-tch = { git = "https://github.com/GPU-Goblin/gg-core", tag = "v0.1.0" }
