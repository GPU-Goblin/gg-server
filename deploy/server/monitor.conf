# Configuration of gg-healthcheck.sh. Install as /etc/gpu-goblin/monitor.conf (mode 0644, no secret).
# The domain is read from /etc/gpu-goblin/domain.env; the admin token from monitor.env (0600).

LOCAL_URL=http://127.0.0.1:8080
BACKUP_DIR=/var/backups/gpu-goblin
DATA_DIR=/var/lib/gpu-goblin
# The PostgreSQL cluster unit, not the "postgresql" umbrella (which stays active when the cluster is down).
SERVICES="gg-server gg-verifier caddy postgresql@17-main"
DISK_MAX_PERCENT=85
BACKUP_MAX_AGE_HOURS=30
CERT_MIN_DAYS=14
# 429 answers between two checks (5 minutes) above which to alert.
QUOTA_REJECTIONS_MAX=200
OUTBOX_MAX=1000
# Consecutive checks (x 5 minutes) without progress before "validation stalled" / "tasks stuck".
STALL_CHECKS=6

# Notifications, DISABLED while empty. Any URL accepting a POST with the text as body works; with
# ntfy, pick a long random topic (anyone who knows it can read it), for example:
#   WEBHOOK_URL=https://ntfy.sh/gg-alerts-<long random string>
WEBHOOK_URL=
REPEAT_HOURS=6
