# nginx for the public site gpugoblin.com (static, built from web/ by build.py) on the shared server,
# next to grid.gpugoblin.com (nginx-gpu-goblin.conf). Install as /etc/nginx/sites-available/gpugoblin-apex;
# certificate from certbot --webroot for gpugoblin.com and www.gpugoblin.com.
# The site's account page talks to the grid's contributor API through /contributor/v1/ here, so
# the browser never makes a cross-site request.

server {
    listen 80;
    listen [::]:80;
    server_name gpugoblin.com www.gpugoblin.com;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://gpugoblin.com$request_uri;
    }
}

# One address for search engines: www leads to the domain itself.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.gpugoblin.com;
    ssl_certificate /etc/letsencrypt/live/gpugoblin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gpugoblin.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://gpugoblin.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gpugoblin.com;

    ssl_certificate /etc/letsencrypt/live/gpugoblin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gpugoblin.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/gpu-goblin/www;
    index index.html;
    server_tokens off;
    charset utf-8;
    access_log /var/log/nginx/gpugoblin-site-access.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 512;

    # Nothing but the site itself: no third-party script, font, image or connection.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # The contributor account API of the grid (same backend as grid.gpugoblin.com).
    location /contributor/v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host grid.gpugoblin.com;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 16k;
        proxy_read_timeout 30s;
    }

    # Fingerprinted or rarely changing files: cached long.
    location ~* \.(?:css|js|woff2|png|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}
