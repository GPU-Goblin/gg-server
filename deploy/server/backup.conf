# Configuration of gg-backup.sh and gg-restore.sh. Install as /etc/gpu-goblin/backup.conf
# (owner root, mode 0644: it holds no secret). Shell syntax, sourced by the scripts.

# Where backups go (owned by gg). Another disk than /var/lib is better; another machine is better
# still (OFFSITE_RSYNC_TARGET below).
BACKUP_DIR=/var/backups/gpu-goblin
# gg-server's data_dir (deploy/server/server.toml).
GG_DATA_DIR=/var/lib/gpu-goblin/server
# PostgreSQL: Unix socket and peer authentication, as gg-server itself. No password.
PG_CONNINFO="host=/var/run/postgresql dbname=gpu_goblin"
# Number of daily dumps kept. An object stays as long as a dump kept may name it; one the retention
# policy removed from the server (ADR-0040) leaves the backup once every dump kept is newer.
KEEP_DUMPS=14

# Off-machine copy with rsync over SSH, DISABLED while empty. The target directory must exist and
# be writable by the SSH user. Example:
#   OFFSITE_RSYNC_TARGET=gg-backup@backup.example.org:/srv/backups/gpu-goblin
#   OFFSITE_SSH_KEY=/var/lib/gpu-goblin/.ssh/backup_ed25519   (create it as gg, no passphrase,
#   restricted on the target with a forced command such as rrsync). Record the target's host key
#   first, the unit cannot answer a prompt:
#   sudo -u gg sh -c 'mkdir -p ~/.ssh && ssh-keyscan backup.example.org >> ~/.ssh/known_hosts'
OFFSITE_RSYNC_TARGET=
OFFSITE_SSH_KEY=
# server.key signs receipts. Keep an offline copy made once at installation; send it off-site only
# if the target is as trusted as this server.
OFFSITE_INCLUDE_KEY=no
