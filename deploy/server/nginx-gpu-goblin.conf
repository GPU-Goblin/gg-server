# nginx in front of gg-server, on a server where nginx already holds ports 80 and 443 for other
# sites (instead of Caddy: docs/DEPLOY.md, "Behind an existing nginx"). Same behaviour as
# deploy/server/Caddyfile. Install as /etc/nginx/sites-available/gpu-goblin, link it into
# sites-enabled, obtain the certificate with certbot, then: nginx -t && systemctl reload nginx.
# The host name is written here twice (server_name): change it together with domain.env.

server {
    listen 80;
    listen [::]:80;
    server_name grid.gpugoblin.com;
    # Let's Encrypt HTTP challenge (certbot --webroot), then everything goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name grid.gpugoblin.com;

    ssl_certificate /etc/letsencrypt/live/grid.gpugoblin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grid.gpugoblin.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Bodies: gg-server accepts max_upload_bytes + 1 KiB on upload routes (1 GiB + 1024) and refuses
    # larger ones with its own message; the proxy limit sits just above. Raise both together.
    client_max_body_size 1025m;
    # An upload may last upload_timeout_secs (3600 s): 1 GiB down to about 2.4 Mbit/s.
    client_body_timeout 3600s;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    access_log /var/log/nginx/gpu-goblin-access.log;

    # Signed releases for contributors (install.sh downloads from here). Plain static files: their
    # authenticity comes from SHA256SUMS.sshsig, not from this server.
    location /releases/ {
        alias /srv/gpu-goblin/releases/;
        autoindex off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The client's address, and only it: gg-server believes this header from 127.0.0.1 and ::1
        # (trusted_proxies) for its per-client quotas and the address it tells workers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Stream both ways: uploads of up to 1 GiB, artifact downloads, long-poll claims.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3700s;
        proxy_send_timeout 3700s;
    }
}
