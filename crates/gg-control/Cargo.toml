[package]
name = "gg-control"
description = "GPU Goblin control plane: versioned HTTP API, admission, scheduler, leases, verification intake, receipts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "gg-server"
path = "src/bin/gg-server.rs"

[dependencies]
gg-core = { workspace = true, features = ["openapi"] }
gg-protocol = { workspace = true }
gg-compute = { workspace = true }
gg-storage = { path = "../gg-storage" }
gg-ledger = { path = "../gg-ledger" }
gg-merkle = { path = "../gg-merkle" }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["csrf"] }
http = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
hex = { workspace = true }
getrandom = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
lettre = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
zeroize = { workspace = true }
serde = { workspace = true }
gg-storage = { path = "../gg-storage", features = ["testing"] }
reqwest = { workspace = true }
tempfile = { workspace = true }
